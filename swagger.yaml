openapi: 3.0.0
info:
  title: Ebooks Reader Backend API
  version: 1.0.3
  description: |
    Оновлена документація REST API для мобільного рідера книг.
    - Додано multipart upload для книги та обкладинки (cover)
    - Додано підтримку Cloudinary для covers
    - Додано публічну бібліотеку книг (marketplace)
    - Додано поля isPublic, imageUrl
    - Оновлено всі схеми та приклади
servers:
  - url: http://localhost:3000
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        login:
          type: string
        role:
          type: string
    Book:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        author:
          type: string
        format:
          type: string
        publisher:
          type: string
        language:
          type: string
        filePath:
          type: string
        storagePath:
          type: string
        originalFilePath:
          type: string
        userId:
          type: integer
        isPublic:
          type: boolean
        imageUrl:
          type: string
    BookHomeFeed:
      type: object
      properties:
        latest:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              title:
                type: string
              author:
                type: string
              imageUrl:
                type: string
              format:
                type: string
              createdAt:
                type: string
                format: date-time
        topRated:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              title:
                type: string
              author:
                type: string
              imageUrl:
                type: string
              format:
                type: string
              avgRating:
                type: number
                format: float
    Collection:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        books:
          type: array
          items:
            $ref: '#/components/schemas/Book'
        userId:
          type: integer
    Bookmark:
      type: object
      properties:
        id:
          type: integer
        bookId:
          type: integer
        userId:
          type: integer
        position:
          type: string
        note:
          type: string
    Note:
      type: object
      properties:
        id:
          type: integer
        bookId:
          type: integer
        userId:
          type: integer
        content:
          type: string
        position:
          type: string
    ReadingProgress:
      type: object
      properties:
        id:
          type: integer
        bookId:
          type: integer
        userId:
          type: integer
        progress:
          type: number
          format: float
        position:
          type: string
    Error:
      type: object
      properties:
        error:
          type: string
security:
  - bearerAuth: []
paths:
  /api/auth/register:
    post:
      summary: Реєстрація користувача
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, login, password]
              properties:
                email:
                  type: string
                  format: email
                login:
                  type: string
                password:
                  type: string
      responses:
        201:
          description: Користувача створено
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
                  token:
                    type: string
                  refreshToken:
                    type: string
        400:
          description: Помилка валідації
  /api/auth/login:
    post:
      summary: Вхід користувача
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        200:
          description: Успішний вхід
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  refreshToken:
                    type: string
        403:
          description: Пошта не підтверджена
        401:
          description: Невірна пошта або пароль
  /api/auth/refresh:
    post:
      summary: Оновлення access token
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        200:
          description: Новий access token
  /api/auth/me:
    get:
      summary: Профіль користувача
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Дані користувача
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        401:
          description: Неавторизовано
  /api/auth/verify-email:
    get:
      summary: Підтвердження пошти
      tags: [Auth]
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        200:
          description: Пошту підтверджено
  /api/auth/resend-verification:
    post:
      summary: Повторне надсилання листа верифікації
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        200:
          description: Лист відправлено
  /api/auth/forgot-password:
    post:
      summary: Запит на відновлення пароля (код + посилання)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        200:
          description: Якщо користувач існує, лист відправлено
  /api/auth/reset-password:
    post:
      summary: Скидання пароля за токеном або кодом
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              oneOf:
                - required: [token, newPassword]
                - required: [email, code, newPassword]
              properties:
                token:
                  type: string
                email:
                  type: string
                  format: email
                code:
                  type: string
                  description: 4-значний код
                newPassword:
                  type: string
      responses:
        200:
          description: Пароль оновлено
  /api/collections:
    get:
      summary: Отримання всіх колекцій користувача
      tags: [Collections]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Список колекцій
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Collection'
        401:
          description: Неавторизовано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Створення нової колекції
      tags: [Collections]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        201:
          description: Колекцію створено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        400:
          description: Помилка валідації
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: Неавторизовано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/collections/{id}:
    get:
      summary: Отримання колекції по ID
      tags: [Collections]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Дані колекції
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        404:
          description: Колекцію не знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: Неавторизовано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Видалення колекції
      tags: [Collections]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        204:
          description: Колекцію видалено
        404:
          description: Колекцію не знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: Неавторизовано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/collections/{collectionId}/books/{bookId}:
    post:
      summary: Додавання книги в колекцію
      tags: [Collections]
      security:
        - bearerAuth: []
      parameters:
        - name: collectionId
          in: path
          required: true
          schema:
            type: integer
        - name: bookId
          in: path
          required: true
          schema:
            type: integer
      responses:
        204:
          description: Книгу додано в колекцію
        404:
          description: Колекцію або книгу не знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: Неавторизовано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Видалення книги з колекції
      tags: [Collections]
      security:
        - bearerAuth: []
      parameters:
        - name: collectionId
          in: path
          required: true
          schema:
            type: integer
        - name: bookId
          in: path
          required: true
          schema:
            type: integer
      responses:
        204:
          description: Книгу видалено з колекції
        404:
          description: Колекцію не знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: Неавторизовано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/mobile/progress:
    get:
      summary: Отримання прогресу всіх книг користувача
      tags: [Mobile]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Список прогресу
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReadingProgress'
        401:
          description: Неавторизовано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/mobile/sync-progress:
    post:
      summary: Синхронізація прогресу читання
      tags: [Mobile]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bookId:
                  type: integer
                progress:
                  type: number
                  format: float
                  minimum: 0
                  maximum: 1
                position:
                  type: string
      responses:
        200:
          description: Прогрес синхронізовано
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        400:
          description: Помилка валідації
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: Неавторизовано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/mobile/bookmarks:
    get:
      summary: Отримання закладок
      tags: [Mobile]
      security:
        - bearerAuth: []
      parameters:
        - name: bookId
          in: query
          schema:
            type: integer
          description: ID книги (опціонально - якщо не вказано, повертаються всі закладки)
      responses:
        200:
          description: Список закладок
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Bookmark'
        400:
          description: Помилка валідації
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: Неавторизовано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Створення закладки
      tags: [Mobile]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bookId:
                  type: integer
                position:
                  type: string
                note:
                  type: string
      responses:
        201:
          description: Закладку створено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bookmark'
        400:
          description: Помилка валідації
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: Неавторизовано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: Книгу не знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/mobile/bookmarks/{id}:
    put:
      summary: Редагування закладки
      tags: [Mobile]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                position:
                  type: string
                note:
                  type: string
      responses:
        200:
          description: Закладку оновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bookmark'
        400:
          description: Помилка валідації
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: Неавторизовано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: Закладку не знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Видалення закладки
      tags: [Mobile]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        204:
          description: Закладку видалено
        404:
          description: Закладку не знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: Неавторизовано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/mobile/notes:
    get:
      summary: Отримання нотаток
      tags: [Mobile]
      security:
        - bearerAuth: []
      parameters:
        - name: bookId
          in: query
          schema:
            type: integer
          description: ID книги (опціонально - якщо не вказано, повертаються всі нотатки)
      responses:
        200:
          description: Список нотаток
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Note'
        400:
          description: Помилка валідації
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: Неавторизовано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Створення нотатки
      tags: [Mobile]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bookId:
                  type: integer
                content:
                  type: string
                position:
                  type: string
      responses:
        201:
          description: Нотатку створено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        400:
          description: Помилка валідації
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: Неавторизовано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: Книгу не знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/mobile/notes/{id}:
    put:
      summary: Редагування нотатки
      tags: [Mobile]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                position:
                  type: string
      responses:
        200:
          description: Нотатку оновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        400:
          description: Помилка валідації
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: Неавторизовано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: Нотатку не знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Видалення нотатки
      tags: [Mobile]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        204:
          description: Нотатку видалено
        404:
          description: Нотатку не знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: Неавторизовано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/mobile/sync-notes:
    post:
      summary: Синхронізація нотаток
      tags: [Mobile]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bookId:
                  type: integer
                notes:
                  type: array
                  items:
                    type: object
                    properties:
                      content:
                        type: string
                      position:
                        type: string
      responses:
        200:
          description: Нотатки синхронізовано
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
        400:
          description: Помилка валідації
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: Неавторизовано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        404:
          description: Книгу не знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/books:
    post:
      summary: Додати книгу (з обкладинкою)
      tags: [Books]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Файл книги (pdf, epub, fb2)
                cover:
                  type: string
                  format: binary
                  description: Обкладинка (завантажується у Cloudinary)
                isPublic:
                  type: boolean
                  description: Чи буде книга публічною
      responses:
        201:
          description: Книга додана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        400:
          description: Помилка валідації
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: Неавторизовано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: Список книг користувача
      tags: [Books]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Список книг
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'
        401:
          description: Неавторизовано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/books/public:
    get:
      summary: Список публічних книг (маркетплейс)
      tags: [Books]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
          description: Номер сторінки
        - name: pageSize
          in: query
          schema:
            type: integer
          description: Кількість на сторінку
        - name: search
          in: query
          schema:
            type: string
          description: Пошук за назвою/автором
      responses:
        200:
          description: Список публічних книг
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'
        401:
          description: Неавторизовано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/books/public/file/{id}:
    get:
      summary: Завантажити файл публічної книги
      tags: [Books]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Файл книги
        404:
          description: Книгу не знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: Неавторизовано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/books/home:
    get:
      summary: Домашня стрічка (останні та топові публічні книги)
      tags: [Books]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Домашня стрічка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookHomeFeed'
        401:
          description: Неавторизовано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/books/sync:
    post:
      summary: Ручний запуск синхронізації (тільки ADMIN)
      tags: [Books]
      security:
        - bearerAuth: []
      parameters:
        - name: pages
          in: query
          schema:
            type: integer
          description: Кількість сторінок Gutendex для вибірки (опц.)
        - name: max
          in: query
          schema:
            type: integer
          description: Максимум книг за прогін (опц.)
      responses:
        200:
          description: Результат синхронізації
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  result:
                    type: array
                    items:
                      type: object
                      properties:
                        source:
                          type: string
                        fetched:
                          type: integer
                        created:
                          type: integer
                        skipped:
                          type: integer
        403:
          description: Доступ заборонено (тільки ADMIN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/books/add-to-my-books/{id}:
    post:
      summary: Додати публічну книгу до своєї бібліотеки
      tags: [Books]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        201:
          description: Книга додана до бібліотеки користувача
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        404:
          description: Книгу не знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: Неавторизовано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/books/{id}:
    get:
      summary: Отримати книгу за id
      tags: [Books]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Книга
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        404:
          description: Книгу не знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: Неавторизовано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Видалити книгу
      tags: [Books]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        204:
          description: Книгу видалено
        404:
          description: Книгу не знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: Неавторизовано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/books/file/{id}:
    get:
      summary: Завантажити файл книги
      tags: [Books]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Файл книги
        404:
          description: Книгу не знайдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: Неавторизовано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error' 
    paths:
  /books/filter:
    get:
      summary: Фільтрація книг
      parameters:
        - name: tags
          in: query
          schema:
            type: string
          description: Теги через кому ("Детектив,Фантастика")
        - name: minRating
          in: query
          schema:
            type: number
            minimum: 0
            maximum: 5
        - name: afterDate
          in: query
          schema:
            type: string
            format: date-time
    responses:
      200:
        description: Список відфільтрованих книг
        content:
          application/json:
            schema:
              type: object
              properties:
                total:
                  type: integer
                page:
                  type: integer
                limit:
                  type: integer
                books:
                  type: array
                  items:
                    $ref: '#/components/schemas/Book'