openapi: 3.0.0
info:
  title: Ebooks Reader Backend API
  version: 1.0.0
  description: Документація REST API для мобільного рідера книг
servers:
  - url: http://localhost:3000
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        login:
          type: string
    Book:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        author:
          type: string
        format:
          type: string
        publisher:
          type: string
        language:
          type: string
        filePath:
          type: string
        storagePath:
          type: string
        originalFilePath:
          type: string
        userId:
          type: integer
    Collection:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        books:
          type: array
          items:
            $ref: '#/components/schemas/Book'
        userId:
          type: integer
    Bookmark:
      type: object
      properties:
        id:
          type: integer
        bookId:
          type: integer
        userId:
          type: integer
        position:
          type: string
        note:
          type: string
    Note:
      type: object
      properties:
        id:
          type: integer
        bookId:
          type: integer
        userId:
          type: integer
        content:
          type: string
        position:
          type: string
    Error:
      type: object
      properties:
        error:
          type: string
security:
  - bearerAuth: []
paths:
  /api/auth/register:
    post:
      summary: Реєстрація користувача
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                login:
                  type: string
                password:
                  type: string
      responses:
        201:
          description: Користувача створено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        400:
          description: Помилка валідації
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/auth/login:
    post:
      summary: Логін користувача
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                login:
                  type: string
                password:
                  type: string
      responses:
        200:
          description: Успішний логін
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  refreshToken:
                    type: string
        401:
          description: Невірний логін або пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/auth/refresh:
    post:
      summary: Оновлення access token
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        200:
          description: Новий access token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        401:
          description: Невірний refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/auth/me:
    get:
      summary: Профіль користувача
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Дані користувача
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        401:
          description: Неавторизовано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/books:
    post:
      summary: Додати книгу
      tags: [Books]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        201:
          description: Книга додана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
    get:
      summary: Список книг користувача
      tags: [Books]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Список книг
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'
  /api/books/{id}:
    get:
      summary: Отримати книгу за id
      tags: [Books]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Книга
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
    delete:
      summary: Видалити книгу
      tags: [Books]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        204:
          description: Книгу видалено
  /api/books/file/{id}:
    get:
      summary: Завантажити файл книги
      tags: [Books]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Файл книги
  /api/collections:
    post:
      summary: Створити колекцію
      tags: [Collections]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
      responses:
        201:
          description: Колекцію створено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
  /api/collections/{id}:
    get:
      summary: Отримати колекцію за id
      tags: [Collections]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Колекція
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
  /api/collections/{collectionId}/books/{bookId}:
    post:
      summary: Додати книгу до колекції
      tags: [Collections]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: collectionId
          required: true
          schema:
            type: integer
        - in: path
          name: bookId
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Книгу додано до колекції
  /api/mobile/sync-progress:
    post:
      summary: Синхронізувати прогрес читання
      tags: [Mobile]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bookId:
                  type: integer
                progress:
                  type: number
                position:
                  type: string
      responses:
        200:
          description: Прогрес синхронізовано
  /api/mobile/bookmarks:
    get:
      summary: Отримати закладки
      tags: [Mobile]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: bookId
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Список закладок
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Bookmark'
    post:
      summary: Створити закладку
      tags: [Mobile]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bookId:
                  type: integer
                position:
                  type: string
                note:
                  type: string
      responses:
        201:
          description: Закладку створено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bookmark'
  /api/mobile/bookmarks/{id}:
    delete:
      summary: Видалити закладку
      tags: [Mobile]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        204:
          description: Закладку видалено
  /api/mobile/notes:
    get:
      summary: Отримати нотатки
      tags: [Mobile]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: bookId
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Список нотаток
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Note'
  /api/mobile/sync-notes:
    post:
      summary: Синхронізувати нотатки
      tags: [Mobile]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bookId:
                  type: integer
                notes:
                  type: array
                  items:
                    type: object
                    properties:
                      content:
                        type: string
                      position:
                        type: string
      responses:
        200:
          description: Нотатки синхронізовано 